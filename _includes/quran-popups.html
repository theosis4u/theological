<!-- Quran pop-ups (opt-in: set quran_popups: true in a page's front matter).
     Turns "Quran 2:255", "Qur'an 2:255", "Surah 1:1-7", or "Sura 112:1" into links to quran.com
     with a hover/focus pop-up from the free, keyless, CORS-enabled Al Quran Cloud API (api.alquran.cloud).
     Default translation: Pickthall (1930, public domain in the US). Override with quran_translation in front matter. -->
<style>
  a.qref { border-bottom: 1px dotted currentColor; text-decoration: none; }
  .qpop { position: absolute; z-index: 1000; max-width: 28rem; background: #fff; color: #111; border: 1px solid #ccc;
          border-radius: 6px; padding: .6rem .8rem; box-shadow: 0 4px 14px rgba(0,0,0,.15); font-size: .9rem; line-height: 1.4; }
  .qpop .ar { direction: rtl; font-size: 1.15rem; margin: .3rem 0; }
  .qpop .src { color: #666; font-size: .75rem; margin-top: .4rem; }
</style>
<script>
(function () {
  var TR = "{{ page.quran_translation | default: 'en.pickthall' }}";
  var API = "https://api.alquran.cloud/v1/";
  var RE = /\b(?:Qur'?an|Qur’an|Surah|Sura)\s+(\d{1,3}):(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?/g;
  var SKIP = { A: 1, CODE: 1, PRE: 1, SCRIPT: 1, STYLE: 1, TEXTAREA: 1 };
  var cache = {}, pop = null, hideTimer = null;

  function tag(root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        for (var p = n.parentNode; p && p !== root; p = p.parentNode) if (SKIP[p.nodeName]) return NodeFilter.FILTER_REJECT;
        RE.lastIndex = 0;
        return RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });
    var nodes = [], n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(function (node) {
      var text = node.nodeValue, frag = document.createDocumentFragment(), last = 0, m;
      RE.lastIndex = 0;
      while ((m = RE.exec(text))) {
        var s = +m[1], a = +m[2], b = m[3] ? +m[3] : a;
        if (s < 1 || s > 114 || a < 1 || b < a) continue;
        frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var el = document.createElement("a");
        el.className = "qref";
        el.href = "https://quran.com/" + s + "/" + a + (b > a ? "-" + b : "");
        el.textContent = m[0];
        el.dataset.s = s; el.dataset.a = a; el.dataset.b = b;
        frag.appendChild(el);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  function load(s, a, b) {
    var key = s + ":" + a + "-" + b;
    if (cache[key]) return cache[key];
    var n = Math.min(b - a + 1, 10);
    var url = API + "surah/" + s + "/editions/quran-uthmani," + TR + "?offset=" + (a - 1) + "&limit=" + n;
    cache[key] = fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (j.code !== 200) throw new Error(j.data || "error");
      return { truncated: b - a + 1 > n, ar: j.data[0], tr: j.data[1] };
    });
    return cache[key];
  }

  function show(el) {
    clearTimeout(hideTimer);
    if (!pop) {
      pop = document.createElement("div"); pop.className = "qpop"; pop.setAttribute("role", "tooltip");
      pop.addEventListener("mouseenter", function () { clearTimeout(hideTimer); });
      pop.addEventListener("mouseleave", hide);
      document.body.appendChild(pop);
    }
    var r = el.getBoundingClientRect();
    pop.style.left = (window.scrollX + r.left) + "px";
    pop.style.top = (window.scrollY + r.bottom + 6) + "px";
    pop.textContent = "Loading…"; pop.style.display = "block";
    load(+el.dataset.s, +el.dataset.a, +el.dataset.b).then(function (d) {
      pop.textContent = "";
      var h = document.createElement("strong");
      h.textContent = d.tr.englishName + " " + el.dataset.s + ":" + el.dataset.a + (el.dataset.b !== el.dataset.a ? "–" + el.dataset.b : "");
      pop.appendChild(h);
      d.tr.ayahs.forEach(function (ay, i) {
        var ar = document.createElement("div"); ar.className = "ar"; ar.lang = "ar"; ar.textContent = d.ar.ayahs[i].text;
        var en = document.createElement("div"); en.textContent = ay.numberInSurah + ". " + ay.text;
        pop.appendChild(ar); pop.appendChild(en);
      });
      var src = document.createElement("div"); src.className = "src";
      src.textContent = (d.truncated ? "First 10 verses shown. " : "") + "Translation: " + d.tr.edition.englishName + ". Text via Al Quran Cloud; click for quran.com.";
      pop.appendChild(src);
    }).catch(function () { pop.textContent = "Could not load this passage. Click the link to read it on quran.com."; });
  }
  function hide() { hideTimer = setTimeout(function () { if (pop) pop.style.display = "none"; }, 250); }

  document.addEventListener("DOMContentLoaded", function () {
    var root = document.querySelector(".page-content") || document.body;
    tag(root);
    root.addEventListener("mouseover", function (e) { var t = e.target.closest && e.target.closest("a.qref"); if (t) show(t); });
    root.addEventListener("mouseout", function (e) { var t = e.target.closest && e.target.closest("a.qref"); if (t) hide(); });
    root.addEventListener("focusin", function (e) { if (e.target.matches && e.target.matches("a.qref")) show(e.target); });
    root.addEventListener("focusout", function (e) { if (e.target.matches && e.target.matches("a.qref")) hide(); });
  });
})();
</script>

<!-- Mermaid diagrams: turns ```mermaid code blocks (kramdown renders them as <code class="language-mermaid">) into diagrams. Loads mermaid.js from a CDN only on pages that have one. -->
<script type="module">
  const blocks = document.querySelectorAll("pre code.language-mermaid, div.language-mermaid code");
  if (blocks.length) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    blocks.forEach((code) => {
      const host = code.closest("div.language-mermaid") || code.closest("pre");
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      host.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "neutral" });
    await mermaid.run({ querySelector: ".mermaid" });
  }
</script>

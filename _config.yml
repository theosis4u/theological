title: Theological
description: A reusable workflow for Bible study with Logos, a Markdown repo, and an AI assistant.
theme: minima
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
exclude:
  - Gemfile
  - Gemfile.lock
header_pages:
  - START-HERE.md
  - guides/logos-github-workflow.md
  - guides/free-resources.md
  - examples/README.md
  - traditions/README.md
  - prompts/README.md
  - docs/project-history.md
defaults:
  - scope:
      path: ""
    values:
      layout: default

name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal link and anchor check
        run: python3 tools/check_links.py
      - name: Privacy check (emails, phone numbers, street addresses)
        run: python3 tools/check_privacy.py

name: Add a prompt
description: Propose a new prompt template or an improvement to one.
title: "[Prompt] "
labels: ["prompt"]
body:
  - type: input
    id: type
    attributes:
      label: Request type
      placeholder: e.g. "word study", "sermon outline"
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt text
      description: Use placeholders like `<your tradition>`. Keep it tradition-neutral.
      render: text
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example and what a good answer looks like
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data.
          required: true

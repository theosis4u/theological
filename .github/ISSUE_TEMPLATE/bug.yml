name: Bug
description: A broken link, script, pop-up, or page.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File path or website URL.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser or environment (for pop-ups and scripts)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal data.
          required: true
